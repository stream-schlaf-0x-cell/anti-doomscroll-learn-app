name: Daily Atmen Edition Ingestion Pipeline

on:
  schedule:
    # 04:30 UTC -> 06:30 CEST / 05:30 CET every morning
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    name: Ingest Live News & Generate Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Ingestion & Enrichment Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run ingest

      - name: Commit & push updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feed-snapshot.json src/core/data/pipeline-output.json src/core/data/source-health.json
          if git diff --staged --quiet; then
            echo "No changes in feed snapshot."
          else
            git commit -m "chore(feed): daily edition snapshot [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
