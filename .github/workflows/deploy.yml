name: Deploy Web App & Public Feed Snapshot to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Refresh public feed snapshot every 6 hours (4 times daily)
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Multi-Daily Feed Ingestion & Snapshot Pipeline
        run: npx tsx scripts/run-pipeline.ts

      - name: Export Expo Web Bundle for GitHub Pages
        run: |
          npx expo export -p web
          sed -i 's|src="/_expo/|src="./_expo/|g' dist/index.html
          sed -i 's|href="/favicon.ico"|href="./favicon.ico"|g' dist/index.html
          if [ -f public/feed-snapshot.json ]; then
            cp public/feed-snapshot.json dist/feed-snapshot.json
          fi
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
