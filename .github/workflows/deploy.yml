name: Deploy Web App & Public Feed Snapshot to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Deterministic Test Suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Bootstrap Public Feed Snapshot (Only if Missing)
        if: hashFiles('public/feed-snapshot.json') == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run ingest

      - name: Export Expo Web Bundle for GitHub Pages
        run: |
          npx expo export -p web
          sed -i 's|src="/_expo/|src="./_expo/|g' dist/index.html
          sed -i 's|href="/favicon.ico"|href="./favicon.ico"|g' dist/index.html
          if [ -f public/feed-snapshot.json ]; then
            cp public/feed-snapshot.json dist/feed-snapshot.json
          fi
          if [ -f public/feed-reservoir.json ]; then
            cp public/feed-reservoir.json dist/feed-reservoir.json
          fi
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for github-pages artifact propagation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages"
          for i in $(seq 1 15); do
            COUNT=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}" | jq -r '.total_count // 0' 2>/dev/null || echo 0)
            case "${COUNT}" in ''|*[!0-9]*) COUNT=0 ;; esac
            echo "Attempt ${i}/15: github-pages artifact total_count=${COUNT}"
            if [ "${COUNT}" -ge 1 ]; then
              echo "Artifact visible via REST API; waiting 5s for Twirp index propagation..."
              sleep 5
              exit 0
            fi
            sleep 2
          done
          echo "Warning: artifact not yet visible after 15 attempts; proceeding after 5s grace wait."
          sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
