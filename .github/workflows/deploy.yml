name: Deploy Web App & Public Feed Snapshot to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Refresh public feed snapshot every 6 hours (4 times daily)
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Deterministic Test Suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Python Scrapling for Fulltext Web Harvesting
        run: pip install --quiet scrapling || true

      - name: Run Multi-Daily Feed Ingestion & Snapshot Pipeline
        if: github.event_name == 'schedule' || hashFiles('public/feed-snapshot.json') == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npx tsx scripts/run-pipeline.ts

      - name: Commit Fresh Snapshot to Main (Scheduled Runs)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feed-snapshot.json src/core/data/pipeline-output.json src/core/data/source-health.json
          if git diff --staged --quiet; then
            echo "No changes in snapshot."
          else
            git commit -m "chore(snapshot): refresh public feed snapshot [skip ci]"
            git push origin main
          fi

      - name: Export Expo Web Bundle for GitHub Pages
        run: |
          npx expo export -p web
          sed -i 's|src="/_expo/|src="./_expo/|g' dist/index.html
          sed -i 's|href="/favicon.ico"|href="./favicon.ico"|g' dist/index.html
          if [ -f public/feed-snapshot.json ]; then
            cp public/feed-snapshot.json dist/feed-snapshot.json
          fi
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
