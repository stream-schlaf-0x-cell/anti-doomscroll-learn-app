name: Virtual Newsroom Scheduled Curation & Pages Deploy

on:
  schedule:
    # Runs every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  newsroom:
    name: 5-Stage Virtual Newsroom Curation & Web Bundle Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Python Scrapling for Fulltext Web Harvesting
        run: pip install --quiet scrapling || true

      - name: Run 5-Stage Virtual Newsroom Ingestion & Reservoir Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run ingest

      - name: Commit & push fresh newsroom snapshot + reservoir
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feed-snapshot.json src/core/data/pipeline-output.json src/core/data/source-health.json
          if [ -f public/feed-reservoir.json ]; then
            git add public/feed-reservoir.json
          fi
          if git diff --staged --quiet; then
            echo "No changes in feed snapshot."
          else
            git commit -m "chore(newsroom): 4-hour virtual newsroom snapshot & reservoir [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase -X ours origin main || true
            git push
          fi

      - name: Export Expo Web Bundle & Fresh Snapshots for GitHub Pages
        run: |
          npx expo export -p web
          sed -i 's|src="/_expo/|src="./_expo/|g' dist/index.html
          sed -i 's|href="/favicon.ico"|href="./favicon.ico"|g' dist/index.html
          if [ -f public/feed-snapshot.json ]; then
            cp public/feed-snapshot.json dist/feed-snapshot.json
          fi
          if [ -f public/feed-reservoir.json ]; then
            cp public/feed-reservoir.json dist/feed-reservoir.json
          fi
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    name: Deploy Newsroom Bundle to GitHub Pages
    needs: newsroom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Wait for github-pages artifact propagation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages"
          for i in $(seq 1 15); do
            COUNT=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}" | jq -r '.total_count // 0' 2>/dev/null || echo 0)
            case "${COUNT}" in ''|*[!0-9]*) COUNT=0 ;; esac
            echo "Attempt ${i}/15: github-pages artifact total_count=${COUNT}"
            if [ "${COUNT}" -ge 1 ]; then
              echo "Artifact visible via REST API; waiting 5s for Twirp index propagation..."
              sleep 5
              exit 0
            fi
            sleep 2
          done
          echo "Warning: artifact not yet visible after 15 attempts; proceeding after 5s grace wait."
          sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
