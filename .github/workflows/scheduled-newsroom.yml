name: Virtual Newsroom Scheduled Curation

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  newsroom:
    name: 5-Stage Virtual Newsroom Curation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Python Scrapling for Fulltext Web Harvesting
        run: pip install --quiet scrapling || true

      - name: Run 5-Stage Virtual Newsroom Ingestion Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run ingest

      - name: Commit & push fresh newsroom snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feed-snapshot.json src/core/data/pipeline-output.json src/core/data/source-health.json
          if git diff --staged --quiet; then
            echo "No changes in feed snapshot."
          else
            git commit -m "chore(newsroom): 6-hour virtual newsroom curation snapshot [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
