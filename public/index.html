<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- viewport-fit=cover enables edge-to-edge rendering into the iPhone notch & dynamic island -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- iOS/iPadOS Home Screen App Icon (Option A) & PWA Manifest -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="manifest" href="./manifest.json" />

    <!-- iOS PWA Fullscreen & Status Bar Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atmen" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0E1424" />

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      /* Full-height viewport-fit cover for iOS/iPadOS standalone PWA across portrait & landscape.
         In iOS standalone mode with a black-translucent status bar, WebKit shortens the layout
         viewport (and 100dvh / inset: 0) by env(safe-area-inset-top) (~59pt on Dynamic Island
         iPhones, ~24pt on iPads), leaving a dead gap below the bottom tab bar.
         syncStandaloneViewportHeight() detects that exact truncation (guarded against iPad Split View)
         and sets --app-height to the full physical screen height while clearing bottom: 0. */
      html {
        background-color: #0E1424 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: var(--app-height, 100dvh);
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        scroll-padding-bottom: calc(4.5rem + env(safe-area-inset-bottom, 0px));
      }
      body {
        background-color: #0E1424 !important;
        margin: 0;
        padding: 0;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: var(--app-height, 100dvh);
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      html[data-standalone-viewport="expanded"] body {
        bottom: auto;
        height: var(--app-height);
      }
      #root {
        display: flex;
        flex-direction: column;
        flex: 1;
        width: 100%;
        height: var(--app-height, 100dvh);
        min-height: 0;
        overflow: hidden;
        background-color: #0E1424 !important;
      }
      /* Ensure touch inertial scrolling works smoothly on iPadOS PWA in both orientations */
      div[style*="overflow"] {
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      (function () {
        function isAppleMobileDevice() {
          var ua = (navigator && navigator.userAgent) || '';
          return (
            /iPad|iPhone|iPod/.test(ua) ||
            (navigator &&
              navigator.platform === 'MacIntel' &&
              typeof navigator.maxTouchPoints === 'number' &&
              navigator.maxTouchPoints > 1)
          );
        }

        function isStandalonePwa() {
          if (typeof window === 'undefined') return false;
          if (window.navigator && window.navigator.standalone === true) return true;
          return Boolean(
            isAppleMobileDevice() &&
              window.matchMedia &&
              window.matchMedia('(display-mode: standalone)').matches
          );
        }

        function isLandscapeOrientation() {
          if (
            window.screen &&
            window.screen.orientation &&
            typeof window.screen.orientation.type === 'string'
          ) {
            return window.screen.orientation.type.indexOf('landscape') === 0;
          }
          if (typeof window.orientation === 'number') {
            return Math.abs(window.orientation) === 90;
          }
          if (window.matchMedia) {
            return window.matchMedia('(orientation: landscape)').matches;
          }
          return window.innerWidth > window.innerHeight;
        }

        function syncStandaloneViewportHeight() {
          var docEl = document.documentElement;
          if (!docEl) return;

          var innerW = window.innerWidth || 0;
          var innerH = window.innerHeight || 0;
          var screenW = (window.screen && window.screen.width) || 0;
          var screenH = (window.screen && window.screen.height) || 0;

          if (isStandalonePwa() && innerW > 0 && innerH > 0 && screenW > 0 && screenH > 0) {
            var landscape = isLandscapeOrientation();
            var expectedScreenWidth = landscape
              ? Math.max(screenW, screenH)
              : Math.min(screenW, screenH);
            var expectedFullHeight = landscape
              ? Math.min(screenW, screenH)
              : Math.max(screenW, screenH);
            var heightDelta = expectedFullHeight - innerH;

            // Guard against iPad Split View / Slide Over / Stage Manager by confirming full-width
            // standalone viewport, and expand only when delta matches WebKit's black-translucent
            // status-bar truncation bug (typically 20–70pt, capped safely at 120pt).
            if (innerW >= expectedScreenWidth * 0.9 && heightDelta > 0 && heightDelta <= 120) {
              docEl.style.setProperty('--app-height', expectedFullHeight + 'px');
              docEl.setAttribute('data-standalone-viewport', 'expanded');
              return;
            }
          }

          var fallbackHeight =
            window.CSS &&
            typeof window.CSS.supports === 'function' &&
            window.CSS.supports('height', '100dvh')
              ? '100dvh'
              : innerH > 0
                ? innerH + 'px'
                : '100vh';
          docEl.style.setProperty('--app-height', fallbackHeight);
          docEl.removeAttribute('data-standalone-viewport');
        }

        var syncTimers = [];
        function scheduleViewportSync() {
          syncStandaloneViewportHeight();
          while (syncTimers.length) {
            clearTimeout(syncTimers.pop());
          }
          syncTimers.push(setTimeout(syncStandaloneViewportHeight, 120));
          syncTimers.push(setTimeout(syncStandaloneViewportHeight, 350));
        }

        syncStandaloneViewportHeight();
        if (typeof window.requestAnimationFrame === 'function') {
          window.requestAnimationFrame(syncStandaloneViewportHeight);
        }
        window.addEventListener('resize', syncStandaloneViewportHeight, { passive: true });
        window.addEventListener('orientationchange', scheduleViewportSync, { passive: true });
        window.addEventListener('pageshow', scheduleViewportSync, { passive: true });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') scheduleViewportSync();
        });
      })();
    </script>
    <script>
      (function () {
        var BUNDLE_RE = /_expo\/static\/js\/web\/([^"'\s>?]+\.js)/;
        var lastCheck = 0;
        var hiddenAt = document.visibilityState === 'hidden' ? Date.now() : 0;
        var lastScrollAt = 0;
        window.addEventListener(
          'scroll',
          function () {
            lastScrollAt = Date.now();
          },
          { passive: true, capture: true }
        );
        function getCurrentBundle() {
          var scripts = document.scripts || [];
          for (var i = 0; i < scripts.length; i++) {
            var m = (scripts[i].src || '').match(BUNDLE_RE);
            if (m && m[1]) return m[1];
          }
          return null;
        }
        function checkForAppUpdate() {
          var now = Date.now();
          if (now - lastCheck < 45000) return;
          var current = getCurrentBundle();
          if (!current) return;
          lastCheck = now;
          fetch('./index.html?_v=' + now, { cache: 'no-store' })
            .then(function (res) { return res.ok ? res.text() : ''; })
            .then(function (html) {
              if (!html) return;
              var m = html.match(BUNDLE_RE);
              var latest = m && m[1];
              if (latest && latest !== current) {
                try {
                  if (sessionStorage.getItem('atem_updated_bundle') === latest) return;
                  sessionStorage.setItem('atem_updated_bundle', latest);
                } catch (e) {}
                var ev = new CustomEvent('atem:update-available', {
                  cancelable: true,
                  detail: { bundle: latest }
                });
                var notCancelled = window.dispatchEvent(ev);
                if (notCancelled && Date.now() - lastScrollAt >= 5000) {
                  window.location.reload();
                }
              }
            })
            .catch(function () {});
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') {
            hiddenAt = Date.now();
          } else if (document.visibilityState === 'visible') {
            var elapsedHidden = hiddenAt > 0 ? Date.now() - hiddenAt : 0;
            hiddenAt = 0;
            if (elapsedHidden >= 60000) {
              checkForAppUpdate();
            }
          }
        });
        window.addEventListener('pageshow', function (ev) {
          if (ev.persisted) checkForAppUpdate();
        });
      })();
    </script>
  </body>
</html>
