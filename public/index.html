<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover enables edge-to-edge rendering into the iPhone notch & dynamic island -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- iOS/iPadOS Home Screen App Icon (Option A) & PWA Manifest -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="manifest" href="./manifest.json" />

    <!-- iOS PWA Fullscreen & Status Bar Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atmen" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0E1424" />

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      /* Full-height viewport-fit cover for iOS standalone PWA (zero bottom dead space) */
      html,
      body,
      #root {
        background-color: #0E1424 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: #0E1424 !important;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        flex: 1;
        height: 100%;
        background-color: #0E1424 !important;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
