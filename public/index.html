<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover enables edge-to-edge rendering into the iPhone notch & dynamic island -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- iOS/iPadOS Home Screen App Icon (Option A) & PWA Manifest -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />

    <!-- iOS PWA Fullscreen & Status Bar Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atmen" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0A0E1A" id="theme-color-meta" />

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      /* These styles make the html and body full-height with dark theme default background */
      html,
      body {
        height: 100%;
        background-color: #0B111E;
        margin: 0;
        padding: 0;
      }
      /* Disable body scrolling when using <ScrollView> and prevent white overscroll glow */
      body {
        overflow: hidden;
        background-color: #0B111E;
        -webkit-tap-highlight-color: transparent;
      }
      /* These styles make the root element full-height with matched background */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #0B111E;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
