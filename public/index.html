<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- viewport-fit=cover enables edge-to-edge rendering into the iPhone notch & dynamic island -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- iOS/iPadOS Home Screen App Icon (Option A) & PWA Manifest -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="manifest" href="./manifest.json" />

    <!-- iOS PWA Fullscreen & Status Bar Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atmen" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0E1424" />

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      /* Full-height viewport-fit cover for iOS/iPadOS standalone PWA across portrait & landscape.
         IMPORTANT: never pin body to height: 100dvh. In iOS standalone mode with a black-translucent
         status bar, WebKit reports 100dvh minus the top safe area (~59pt), which leaves a dead gap
         below the tab bar. A fixed body stretched with inset: 0 always reaches the physical bottom edge. */
      html {
        background-color: #0E1424 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }
      body {
        background-color: #0E1424 !important;
        margin: 0;
        padding: 0;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        inset: 0;
        width: 100%;
        height: auto;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        flex-direction: column;
        flex: 1;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        background-color: #0E1424 !important;
      }
      /* Ensure touch inertial scrolling works smoothly on iPadOS PWA in both orientations */
      div[style*="overflow"] {
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      (function () {
        var BUNDLE_RE = /_expo\/static\/js\/web\/([^"'\s>?]+\.js)/;
        var lastCheck = 0;
        function getCurrentBundle() {
          var scripts = document.scripts || [];
          for (var i = 0; i < scripts.length; i++) {
            var m = (scripts[i].src || '').match(BUNDLE_RE);
            if (m && m[1]) return m[1];
          }
          return null;
        }
        function checkForAppUpdate() {
          var now = Date.now();
          if (now - lastCheck < 45000) return;
          var current = getCurrentBundle();
          if (!current) return;
          lastCheck = now;
          fetch('./index.html?_v=' + now, { cache: 'no-store' })
            .then(function (res) { return res.ok ? res.text() : ''; })
            .then(function (html) {
              if (!html) return;
              var m = html.match(BUNDLE_RE);
              var latest = m && m[1];
              if (latest && latest !== current) {
                try {
                  if (sessionStorage.getItem('atem_updated_bundle') === latest) return;
                  sessionStorage.setItem('atem_updated_bundle', latest);
                } catch (e) {}
                window.location.reload();
              }
            })
            .catch(function () {});
        }
        setTimeout(checkForAppUpdate, 1500);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') checkForAppUpdate();
        });
        window.addEventListener('pageshow', function (ev) {
          if (ev.persisted) checkForAppUpdate();
        });
      })();
    </script>
  </body>
</html>
